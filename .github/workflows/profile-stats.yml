# Generates the profile stats cards and the contribution snake into this repo,
# so the README no longer depends on a public stats server that goes down.
name: Stats du profil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  # Paths filter: the cards commit only touches profile-summary-card-output/, so it cannot retrigger itself.
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

jobs:
  summary-cards:
    runs-on: ubuntu-latest
    steps:
      # Commits SVG cards into profile-summary-card-output/ on the default branch.
      # The action's docs ask for a PAT (classic: public_repo + read:user) in a SUMMARY_GITHUB_TOKEN secret;
      # falls back to the built-in token if the secret is missing.
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          TIME_ZONE: Europe/Paris

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
      # Pushes the snake to the "output" branch, read by the README.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
